<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JateamHub — Architecture Flowchart</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #FAFAF8;
    --bg2:      #F4F3F0;
    --bg3:      #FFFFFF;
    --border:   #E8E7E3;
    --border2:  #D0CFC9;
    --silver:   #1A1A1A;
    --silver2:  #4B4B4B;
    --silver3:  #8A8A8A;
    --accent:   #2563EB;
    --accent2:  #1D4ED8;
    --success:  #16A34A;
    --warning:  #D97706;
    --red:      #DC2626;
    --purple:   #7C3AED;
    --teal:     #0D9488;
    --font:     'Plus Jakarta Sans', sans-serif;
    --mono:     'JetBrains Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--silver);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Header ─────────────────────────── */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(250,250,248,0.94);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 56px;
    display: flex; align-items: center; gap: 16px;
  }
  .header h1 {
    font-size: 15px; font-weight: 800;
    letter-spacing: -0.3px;
  }
  .header span {
    font-size: 11px; color: var(--silver3);
    font-family: var(--mono);
  }
  .header-right {
    margin-left: auto;
    display: flex; gap: 8px; align-items: center;
  }
  .tab-btn {
    height: 32px; padding: 0 14px;
    background: none; border: 1px solid var(--border);
    border-radius: 6px; color: var(--silver2);
    font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: var(--font);
    transition: all 150ms ease;
  }
  .tab-btn:hover  { border-color: var(--accent); color: var(--accent); }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* ── Canvas ─────────────────────────── */
  .canvas-wrap {
    position: relative;
    overflow: auto;
    height: calc(100vh - 56px);
    cursor: grab;
  }
  .canvas-wrap:active { cursor: grabbing; }
  .canvas {
    position: relative;
    transform-origin: 0 0;
  }
  svg.lines {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
  }

  /* ── Node ─────────────────────────── */
  .node {
    position: absolute;
    background: var(--bg3);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    min-width: 160px;
    cursor: pointer;
    transition: box-shadow 150ms ease, border-color 150ms ease, transform 150ms ease;
    user-select: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .node:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.10);
    transform: translateY(-1px);
  }
  .node.selected {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15), 0 4px 16px rgba(0,0,0,0.10);
  }
  .node.dragging {
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    z-index: 1000;
    transform: scale(1.02);
  }
  .node-icon  { font-size: 18px; margin-bottom: 6px; display: block; }
  .node-label {
    font-size: 12px; font-weight: 700;
    letter-spacing: -0.2px; line-height: 1.3;
  }
  .node-sub {
    font-size: 10px; color: var(--silver3);
    margin-top: 3px; font-family: var(--mono);
    line-height: 1.4;
  }
  .node-badge {
    display: inline-block;
    margin-top: 6px; padding: 2px 7px;
    border-radius: 99px;
    font-size: 9px; font-weight: 700;
    font-family: var(--mono); text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Color variants */
  .node.blue   { border-color: #93C5FD; background: #EFF6FF; }
  .node.green  { border-color: #86EFAC; background: #F0FDF4; }
  .node.red    { border-color: #FCA5A5; background: #FEF2F2; }
  .node.purple { border-color: #C4B5FD; background: #F5F3FF; }
  .node.amber  { border-color: #FCD34D; background: #FFFBEB; }
  .node.teal   { border-color: #5EEAD4; background: #F0FDFA; }
  .node.gray   { border-color: var(--border2); background: var(--bg2); }
  .node.dark   { border-color: #374151; background: #111827; color: #F9FAFB; }
  .node.dark .node-sub { color: #9CA3AF; }

  /* Group label */
  .group-label {
    position: absolute;
    font-size: 10px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--silver3);
    font-family: var(--mono);
    pointer-events: none;
  }
  .group-bg {
    position: absolute;
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    pointer-events: none;
  }

  /* ── Sidebar info ─────────────────── */
  .sidebar {
    position: fixed;
    top: 56px; right: 0;
    width: 280px; height: calc(100vh - 56px);
    background: var(--bg3);
    border-left: 1px solid var(--border);
    padding: 20px;
    transform: translateX(100%);
    transition: transform 250ms ease;
    overflow-y: auto;
    z-index: 200;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar h3 { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
  .sidebar .meta {
    font-size: 10px; color: var(--silver3);
    font-family: var(--mono); margin-bottom: 16px;
  }
  .sidebar .field { margin-bottom: 12px; }
  .sidebar .field label {
    display: block; font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--silver3); font-family: var(--mono);
    margin-bottom: 4px;
  }
  .sidebar .field p {
    font-size: 12px; color: var(--silver2);
    line-height: 1.6;
  }
  .sidebar .tag {
    display: inline-block; padding: 2px 8px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 4px; font-size: 10px;
    font-family: var(--mono); margin: 2px;
  }
  .close-sidebar {
    position: absolute; top: 16px; right: 16px;
    width: 28px; height: 28px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--silver3);
  }

  /* ── Legend ─────────────────────── */
  .legend {
    position: fixed; bottom: 24px; left: 24px;
    background: rgba(255,255,255,0.95);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px;
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .legend-title {
    font-size: 9px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--silver3); font-family: var(--mono);
    margin-bottom: 8px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 4px; font-size: 11px; color: var(--silver2);
  }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0;
  }

  /* ── Toolbar ─────────────────────── */
  .toolbar {
    position: fixed; bottom: 24px; right: 24px;
    display: flex; gap: 6px; z-index: 100;
  }
  .tool-btn {
    width: 40px; height: 40px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 150ms ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .tool-btn:hover { border-color: var(--accent); background: #EFF6FF; }

  /* Connection line label */
  .conn-label {
    font-size: 9px; fill: var(--silver3);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="header">

      { from: 'shared_reg', to: 'user', label: 'visible to region' },
      { from: 'shared_unit', to: 'user', label: 'visible to unit' },
      { from: 'register', to: 'approve', label: 'pending' },
      { from: 'approve', to: 'user', label: 'approved' },
    ],
  },
}

// ── LEGENDS ────────────────────────────────────────────────────
const LEGENDS = {
  app:   [
    { color: '#BFDBFE', label: 'React Component' },
    { color: '#BBF7D0', label: 'Zustand Store' },
    { color: '#D9F99D', label: 'Widget' },
    { color: '#FEF08A', label: 'Auth Screen' },
    { color: '#E9D5FF', label: 'Superadmin' },
  ],
  auth:  [
    { color: '#BBF7D0', label: 'Success / Valid' },
    { color: '#FECACA', label: 'Error / Invalid' },
    { color: '#BFDBFE', label: 'Process / API call' },
    { color: '#E9D5FF', label: 'System Event' },
    { color: '#FEF08A', label: 'UI Screen' },
  ],
  data:  [
    { color: '#BFDBFE', label: 'Component / API' },
    { color: '#BBF7D0', label: 'State / Store' },
    { color: '#FEF08A', label: 'Cache (localStorage)' },
    { color: '#E9D5FF', label: 'Optimization' },
    { color: '#CCFBF1', label: 'Status / Meta' },
  ],
  roles: [
    { color: '#E9D5FF', label: 'Superadmin' },
    { color: '#BFDBFE', label: 'Admin Global' },
    { color: '#CCFBF1', label: 'Admin Region/Unit' },
    { color: '#F3F4F6', label: 'User / Guest' },
    { color: '#FEF08A', label: 'Content / Action' },
  ],
}

// ── STATE ──────────────────────────────────────────────────────
let currentView = 'app'
let scale = 1
let panX = 40, panY = 40
let isPanning = false
let panStart = { x: 0, y: 0 }
let selectedNode = null
let dragNode = null
let dragOffset = { x: 0, y: 0 }
let nodePositions = {}

// ── RENDER ─────────────────────────────────────────────────────
function getNodes() {
  return FLOWS[currentView].nodes.map(n => ({
    ...n,
    x: nodePositions[currentView]?.[n.id]?.x ?? n.x,
    y: nodePositions[currentView]?.[n.id]?.y ?? n.y,
  }))
}

function render() {
  const canvas = document.getElementById('canvas')
  const svg    = document.getElementById('svg')
  const wrap   = document.getElementById('canvasWrap')
  const flow   = FLOWS[currentView]
  const nodes  = getNodes()

  // Set canvas size
  const maxX = Math.max(...nodes.map(n => n.x)) + 300
  const maxY = Math.max(...nodes.map(n => n.y)) + 200
  canvas.style.width  = maxX + 'px'
  canvas.style.height = maxY + 'px'
  canvas.style.transform = `scale(${scale}) translate(${panX/scale}px, ${panY/scale}px)`

  // Clear existing nodes (keep svg)
  Array.from(canvas.children).forEach(c => {
    if (c !== svg) c.remove()
  })

  // Render nodes
  nodes.forEach(n => {
    const el = document.createElement('div')
    el.className = `node ${n.color || ''}`
    el.id = 'node-' + n.id
    el.style.left = n.x + 'px'
    el.style.top  = n.y + 'px'
    if (selectedNode === n.id) el.classList.add('selected')
    el.innerHTML = `
      <span class="node-icon">${n.icon}</span>
      <div class="node-label">${n.label.replace('\n', '<br>')}</div>
      ${n.sub ? `<div class="node-sub">${n.sub.replace(/\n/g, '<br>')}</div>` : ''}
    `
    el.addEventListener('mousedown', e => startNodeDrag(e, n.id))
    el.addEventListener('click', e => { e.stopPropagation(); selectNode(n.id) })
    canvas.appendChild(el)
  })

  // Render edges after nodes (so we can get positions)
  requestAnimationFrame(renderEdges)

  // Render legend
  renderLegend()
}

function renderEdges() {
  const svg   = document.getElementById('svg')
  const nodes = getNodes()
  const flow  = FLOWS[currentView]

  // Size SVG
  const canvas = document.getElementById('canvas')
  svg.setAttribute('width',  canvas.style.width)
  svg.setAttribute('height', canvas.style.height)

  svg.innerHTML = `<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C4C4C0" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93C5FD" />
    </marker>
  </defs>`

  flow.edges.forEach(edge => {
    const fromNode = nodes.find(n => n.id === edge.from)
    const toNode   = nodes.find(n => n.id === edge.to)
    if (!fromNode || !toNode) return

    const fromEl = document.getElementById('node-' + edge.from)
    const toEl   = document.getElementById('node-' + edge.to)
    if (!fromEl || !toEl) return

    const fw = fromEl.offsetWidth  || 180
    const fh = fromEl.offsetHeight || 80
    const tw = toEl.offsetWidth    || 180
    const th = toEl.offsetHeight   || 80

    const x1 = fromNode.x + fw / 2
    const y1 = fromNode.y + fh / 2
    const x2 = toNode.x   + tw / 2
    const y2 = toNode.y   + th / 2

    // Calculate edge points (from border, not center)
    const dx = x2 - x1, dy = y2 - y1
    const angle = Math.atan2(dy, dx)
    const sx = x1 + Math.cos(angle) * fw/2
    const sy = y1 + Math.sin(angle) * fh/2
    const ex = x2 - Math.cos(angle) * (tw/2 + 8)
    const ey = y2 - Math.sin(angle) * (th/2 + 8)

    // Bezier curve
    const mx = (sx + ex) / 2
    const my = (sy + ey) / 2
    const bx = mx - dy * 0.15
    const by = my + dx * 0.15

    const isHighlighted = selectedNode === edge.from || selectedNode === edge.to

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    path.setAttribute('d', `M ${sx} ${sy} Q ${bx} ${by} ${ex} ${ey}`)
    path.setAttribute('fill', 'none')
    path.setAttribute('stroke', isHighlighted ? '#93C5FD' : '#D0CFC9')
    path.setAttribute('stroke-width', isHighlighted ? '2' : '1.5')
    path.setAttribute('marker-end', isHighlighted ? 'url(#arrow-blue)' : 'url(#arrow)')
    path.setAttribute('stroke-dasharray', '0')
    svg.appendChild(path)

    if (edge.label) {
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text')
      text.setAttribute('x', bx)
      text.setAttribute('y', by - 6)
      text.setAttribute('text-anchor', 'middle')
      text.setAttribute('class', 'conn-label')
      text.textContent = edge.label
      svg.appendChild(text)
    }
  })
}

function renderLegend() {
  const legend = document.getElementById('legend')
  const items  = LEGENDS[currentView] || []
  legend.innerHTML = `<div class="legend-title">Legend</div>` +
    items.map(i => `
      <div class="legend-item">
        <div class="legend-dot" style="background:${i.color};border:1px solid rgba(0,0,0,0.08)"></div>
        <span>${i.label}</span>
      </div>
    `).join('')
}

// ── NODE INTERACTIONS ──────────────────────────────────────────
function selectNode(id) {
  const nodes = getNodes()
  const node  = nodes.find(n => n.id === id)
  selectedNode = (selectedNode === id) ? null : id
  render()
  if (selectedNode && node?.detail) {
    openSidebar(node)
  } else {
    closeSidebar()
  }
}

function openSidebar(node) {
  const sb      = document.getElementById('sidebar')
  const content = document.getElementById('sidebar-content')
  sb.classList.add('open')
  content.innerHTML = `
    <h3>${node.icon} ${node.label.replace('<br>', ' ')}</h3>
    <div class="meta">${node.sub || ''}</div>
    ${node.detail?.desc ? `
      <div class="field">
        <label>Deskripsi</label>
        <p>${node.detail.desc.replace(/\n/g, '<br>')}</p>
      </div>` : ''}
    ${node.detail?.tags?.length ? `
      <div class="field">
        <label>Tags / Dependencies</label>
        <div>${node.detail.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>` : ''}
  `
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open')
  selectedNode = null
  renderEdges()
}

// ── NODE DRAG ──────────────────────────────────────────────────
function startNodeDrag(e, id) {
  if (e.button !== 0) return
  e.stopPropagation()
  const nodes = getNodes()
  const node  = nodes.find(n => n.id === id)
  dragNode   = id
  dragOffset = {
    x: e.clientX / scale - node.x - panX/scale,
    y: e.clientY / scale - node.y - panY/scale,
  }
  document.getElementById('node-' + id)?.classList.add('dragging')
}

document.addEventListener('mousemove', e => {
  if (dragNode) {
    const x = e.clientX / scale - dragOffset.x - panX/scale
    const y = e.clientY / scale - dragOffset.y - panY/scale
    if (!nodePositions[currentView]) nodePositions[currentView] = {}
    nodePositions[currentView][dragNode] = { x: Math.max(0, x), y: Math.max(0, y) }
    const el = document.getElementById('node-' + dragNode)
    if (el) {
      el.style.left = Math.max(0, x) + 'px'
      el.style.top  = Math.max(0, y) + 'px'
    }
    requestAnimationFrame(renderEdges)
  }
})

document.addEventListener('mouseup', e => {
  if (dragNode) {
    document.getElementById('node-' + dragNode)?.classList.remove('dragging')
    dragNode = null
  }
  if (isPanning) isPanning = false
})

// ── PAN ────────────────────────────────────────────────────────
const wrap = document.getElementById('canvasWrap')
wrap.addEventListener('mousedown', e => {
  if (e.button !== 0 || dragNode) return
  isPanning  = true
  panStart   = { x: e.clientX - panX, y: e.clientY - panY }
})
wrap.addEventListener('mousemove', e => {
  if (!isPanning) return
  panX = e.clientX - panStart.x
  panY = e.clientY - panStart.y
  document.getElementById('canvas').style.transform =
    `scale(${scale}) translate(${panX/scale}px, ${panY/scale}px)`
  requestAnimationFrame(renderEdges)
})

// ── ZOOM ────────────────────────────────────────────────────────
wrap.addEventListener('wheel', e => {
  e.preventDefault()
  const delta = e.deltaY > 0 ? 0.9 : 1.1
  zoom(delta)
}, { passive: false })

function zoom(factor) {
  scale = Math.min(Math.max(scale * factor, 0.3), 3)
  document.getElementById('canvas').style.transform =
    `scale(${scale}) translate(${panX/scale}px, ${panY/scale}px)`
  requestAnimationFrame(renderEdges)
}

function resetZoom() {
  scale = 1; panX = 40; panY = 40
  document.getElementById('canvas').style.transform =
    `scale(1) translate(40px, 40px)`
  requestAnimationFrame(renderEdges)
}

// ── VIEW SWITCHER ──────────────────────────────────────────────
function showView(view) {
  currentView  = view
  selectedNode = null
  document.getElementById('sidebar').classList.remove('open')
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.textContent.toLowerCase().includes(view) ||
      (view === 'app' && b.textContent === 'App Flow') ||
      (view === 'auth' && b.textContent === 'Auth Flow') ||
      (view === 'data' && b.textContent === 'Data Flow') ||
      (view === 'roles' && b.textContent === 'Role System'))
  )
  resetZoom()
  render()
}

// Click canvas to deselect
document.getElementById('canvas').addEventListener('click', e => {
  if (e.target === document.getElementById('canvas') ||
      e.target === document.getElementById('svg')) {
    selectedNode = null
    closeSidebar()
    renderEdges()
  }
})

// ── INIT ──────────────────────────────────────────────────────
render()
</script>
</body>
</html>
