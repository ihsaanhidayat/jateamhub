<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JateamHub</title>
    <!-- Theme init SEBELUM apapun — mencegah flash -->
    <script>
      (function(){
        try {
          var t = localStorage.getItem('jateamhub-theme')
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = t || (d ? 'slate' : 'pearl')
          document.documentElement.setAttribute('data-theme', theme)
          // Update status bar color ikut tema
          var color = theme === 'slate' ? '#0F1117' : '#F5F6FA'
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', color)
        } catch(e) {}
      })()
    </script>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F5F6FA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JateamHub" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
        })
      }
    </script>
  </body>
</html>
